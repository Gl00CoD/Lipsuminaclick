name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        shell: bash
        run: |
          set +e
          swift test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          # Surface compiler and test errors as annotations on the run.
          grep -E "error:|failed" test.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
      - name: Build app
        shell: bash
        run: |
          set +e
          ./build.sh 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "error:" build.log | head -20 | while IFS= read -r line; do echo "::error::$line"; done
          exit $status
      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: LipsumInAClick
          path: build/LipsumInAClick.zip
